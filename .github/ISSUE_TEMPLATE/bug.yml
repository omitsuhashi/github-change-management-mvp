name: 不具合の報告
description: 再現手順と期待する動作を記録する
title: "[不具合] "
labels: [bug]
projects: ["omitsuhashi/12"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順・対象
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作・影響
    validations:
      required: true
